<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Anime Energy Orb — Webcam AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #020611;
      font-family: 'Rajdhani', sans-serif;
      color: #e2e8f0;
    }

    .hidden { display: none !important; }

    /* ── Splash / Loading Screen ── */
    #splash {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #07152d 0%, #020713 70%, #000208 100%);
      flex-direction: column; gap: 24px;
    }

    #splash h1 {
      font-family: 'Orbitron', monospace;
      font-size: 28px; font-weight: 900; letter-spacing: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    #splash p {
      font-size: 13px; letter-spacing: 3px; color: #64748b;
      font-family: 'Orbitron', monospace;
    }

    .loader {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 22px; border-radius: 24px;
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(56,189,248,0.2);
    }
    .loader .spin {
      width: 14px; height: 14px;
      border: 2px solid rgba(56,189,248,0.2);
      border-top-color: #38bdf8; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loader span {
      font-family: 'Orbitron', monospace; font-size: 11px;
      letter-spacing: 2px; color: #94a3b8;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #btn-start {
      padding: 16px 48px; border-radius: 36px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid rgba(56,189,248,0.6);
      color: #fff; font-family: 'Orbitron', monospace;
      font-size: 14px; font-weight: 700; letter-spacing: 3px;
      cursor: pointer; transition: all .3s ease;
    }
    #btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(56,189,248,0.5);
    }

    .instructions {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; margin-top: 12px;
    }
    .instructions span {
      font-size: 13px; color: #475569; letter-spacing: 1.5px;
    }

    /* ── Main AR View ── */
    #app { position: fixed; inset: 0; background: #000; }

    #camera-feed {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0; background: #020617;
    }

    #three-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }

    /* ── Minimal HUD ── */
    #hud {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%); z-index: 10;
      display: flex; align-items: center; gap: 12px;
    }

    .badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 20px;
      background: rgba(15,23,42,0.75);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      font-family: 'Orbitron', monospace;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      transition: all .25s ease;
    }

    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; } 50% { opacity: .4; }
    }

    #gesture-badge {
      border-color: rgba(56,189,248,0.5);
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(56,189,248,0.2);
    }
    #gesture-badge.fist {
      border-color: rgba(249,115,22,0.6);
      color: #fb923c;
      box-shadow: 0 0 12px rgba(249,115,22,0.3);
    }
    #gesture-badge.pinch {
      border-color: rgba(234,179,8,0.6);
      color: #facc15;
      box-shadow: 0 0 12px rgba(234,179,8,0.3);
    }

    /* ── Hint Overlay ── */
    #hint {
      position: absolute; bottom: 36px; left: 50%;
      transform: translateX(-50%); z-index: 10;
      padding: 10px 28px; border-radius: 24px;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(56,189,248,0.2);
      backdrop-filter: blur(12px);
      font-size: 14px; font-weight: 600; color: #94a3b8;
      transition: opacity .6s ease;
    }
    #hint.fade { opacity: 0; pointer-events: none; }

    /* ── Screenshot Button ── */
    #btn-capture {
      position: absolute; bottom: 36px; right: 24px; z-index: 10;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(15,23,42,0.75);
      border: 2px solid rgba(255,255,255,0.2);
      color: #cbd5e1; font-size: 20px;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; backdrop-filter: blur(12px);
      transition: all .2s ease;
    }
    #btn-capture:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56,189,248,0.3);
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <h1>ANIME ENERGY ORB</h1>
    <p>REAL-TIME WEBCAM AR</p>
    <div id="loader" class="loader">
      <div class="spin"></div>
      <span id="status-msg">LOADING AI VISION…</span>
    </div>
    <button id="btn-start" class="hidden">⚡ START</button>
    <div class="instructions">
      <span>🖐 OPEN PALM — SUMMON ORB</span>
      <span>✊ FIST — CHARGE</span>
      <span>🤏 PINCH — RESIZE</span>
    </div>
  </div>

  <!-- AR View -->
  <div id="app" class="hidden">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>

    <div id="hud">
      <div class="badge"><div class="live-dot"></div><span>LIVE</span></div>
      <div id="gesture-badge" class="badge">
        <span id="gesture-icon">🖐</span>
        <span id="gesture-label">SEARCHING…</span>
      </div>
    </div>

    <div id="hint">Raise your open hand in front of the camera</div>
    <button id="btn-capture" title="Screenshot">📸</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
